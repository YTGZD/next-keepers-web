; Next Keepers PHP-FPM pool (installed by deploy/setup-server.sh).
; Runs as the deploy user so files written by the website and by artisan
; commands (logs, cache, SQLite) are owned by the same account.
[next-keepers]
user = __DEPLOY_USER__
group = www-data
listen = /run/php/next-keepers.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500
php_admin_value[upload_max_filesize] = 200M
php_admin_value[post_max_size] = 200M
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 300
