# Next Keepers app (installed by deploy/setup-server.sh).
# Cloudflare terminates HTTPS for visitors; this listens on 80 ("Flexible") and on
# 443 with a self-signed origin cert ("Full"). Other sites on this server are untouched.
server {
    listen 80;
    listen 443 ssl http2;
    server_name __APP_DOMAIN__;

    ssl_certificate     __CERT_DIR__/origin.crt;
    ssl_certificate_key __CERT_DIR__/origin.key;

    root __APP_DIR__/public;
    index index.php;
    charset utf-8;
    client_max_body_size 200M;   # admin uploads of listing files

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/next-keepers.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
